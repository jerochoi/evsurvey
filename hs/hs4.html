<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수소충전소 관리대장</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tom Select CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fc;
            font-family: 'Noto Sans KR', sans-serif;
            color: #333;
        }

        .navbar {
            background-color: #ffffff;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            padding: 1rem 2rem;
            margin-bottom: 2rem;
        }

        .navbar-brand {
            font-weight: 700;
            color: #2c3e50;
        }

        .card {
            border: none;
            border-radius: 0.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 2rem;
        }

        .card-header {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0.5rem 0.5rem 0 0 !important;
        }

        .card-title {
            margin: 0;
            font-weight: 600;
            color: #2c3e50;
        }

        .table {
            margin-bottom: 0;
            font-size: 0.8rem;
        }

        .table th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
            padding: 0.4rem 0.6rem;
        }

        .table td {
            padding: 0.4rem 0.6rem;
            vertical-align: middle;
            color: #555;
            border-bottom: 1px solid #e9ecef;
        }

        .table tr:hover {
            background-color: #f1f5f9;
            cursor: pointer;
        }

        .badge {
            padding: 0.55em 0.9em;
            font-weight: 500;
            border-radius: 4px;
        }

        .badge-status-gu {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .badge-status-un {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .badge-status-ye {
            background-color: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }

        .badge-status-can {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .badge-status-gray {
            background-color: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm-icon {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            border-radius: 0.2rem;
        }

        /* Search Box */
        .search-container {
            padding: 1.5rem;
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 1.5rem;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
            border-color: #8bbafe;
        }
        
        /* Force Korean IME Mode (IE/Edge/Some browsers fallback) */
        #searchKeyword,
        .ts-wrapper input {
            ime-mode: active !important;
        }

        /* Table Horizontal Scroll Details */
        .table-responsive {
            height: calc(100vh - 430px);
            max-height: calc(100vh - 430px);
            overflow: auto;
        }

        table.collapsed-grp-year .group-toggle-grp-year,
        table.collapsed-grp-permit .group-toggle-grp-permit,
        table.collapsed-grp-consult .group-toggle-grp-consult,
        table.collapsed-grp-detail .group-toggle-grp-detail,
        table.collapsed-grp-budget .group-toggle-grp-budget,
        table.collapsed-grp-operate .group-toggle-grp-operate {
            display: none !important;
        }

        table.collapsed-grp-year .group-first-grp-year,
        table.collapsed-grp-permit .group-first-grp-permit,
        table.collapsed-grp-consult .group-first-grp-consult,
        table.collapsed-grp-detail .group-first-grp-detail,
        table.collapsed-grp-budget .group-first-grp-budget,
        table.collapsed-grp-operate .group-first-grp-operate {
            background-color: #f8f9fa !important;
            color: #adb5bd !important;
            border-right: 2px dashed #ced4da !important;
        }

        .table th,
        .table td {
            white-space: nowrap;
        }

        /* Sorting styling */
        .table th[onclick] {
            cursor: pointer;
        }
        .table th[onclick]:hover {
            background-color: #e2e6ea !important;
        }

        .table thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-clip: padding-box;
            box-shadow: inset 0 -1px 0 #dee2e6;
        }

        .sticky-col {
            position: sticky;
            right: 0;
            z-index: 11;
        }

        /* Alphabet-like Scroll Index */
        .scroll-index {
            position: fixed;
            right: 0px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: -2px 0 5px rgba(0,0,0,0.15);
            border-radius: 10px 0 0 10px;
            padding: 10px 2px;
            z-index: 1050;
            font-size: 0.75rem;
            max-height: 80vh;
            overflow-y: auto;
        }

        .scroll-index-item {
            cursor: pointer;
            padding: 4px 6px;
            color: #6c757d;
            font-weight: 700;
            text-align: center;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .scroll-index-item:hover,
        .scroll-index-item.active {
            background: #0d6efd;
            color: #fff;
        }

        /* Horizontal Category Scroll Index */
        .scroll-h-index {
            position: fixed;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 -2px 5px rgba(0,0,0,0.15);
            border-radius: 10px 10px 0 0;
            padding: 2px 10px;
            z-index: 1050;
            font-size: 0.75rem;
            max-width: 90vw;
            overflow-x: auto;
            align-items: center;
        }

        .scroll-h-index-item {
            cursor: pointer;
            padding: 6px 10px;
            color: #6c757d;
            font-weight: 700;
            text-align: center;
            border-radius: 4px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .scroll-h-index-item:hover,
        .scroll-h-index-item.active {
            background: #0d6efd;
            color: #fff;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-gas-pump text-primary me-2"></i>수소충전소 관리대장</a>
        </div>
    </nav>

    <div class="container-fluid px-4">

        <div class="row mb-4 align-items-center">
            <div class="col">
                <h2 class="h4 mb-0 text-gray-800">충전소 데이터 목록</h2>
            </div>
            <div class="col-auto">
                <a href="hs4_form.html" class="btn btn-primary shadow-sm"><i class="fa-solid fa-plus me-1"></i> 신규
                    등록</a>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <form class="row g-3" id="searchForm">
                <div class="col-md-2">
                    <label for="searchStatus" class="form-label text-muted small fw-bold">구분</label>
                    <select id="searchStatus" class="form-select">
                        <option value="">전체</option>
                        <option value="구축중">구축중</option>
                        <option value="운영중">운영중</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="searchMinistry" class="form-label text-muted small fw-bold">담당부처</label>
                    <select id="searchMinistry" class="form-select">
                        <option value="">전체</option>
                        <option value="환경부">환경부</option>
                        <option value="국토부">국토부</option>
                        <option value="산업부">산업부</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="searchRegion" class="form-label text-muted small fw-bold">지역 (시도/시군구)</label>
                    <select id="searchRegion" class="form-select" multiple placeholder="지역 선택 (여러곳 선택, 초성지원)"></select>
                </div>
                <div class="col-md-3">
                    <label for="searchKeyword" class="form-label text-muted small fw-bold">검색어 (충전소명/주소)</label>
                    <input type="text" class="form-control" id="searchKeyword" placeholder="검색어를 입력하세요" style="ime-mode: active;">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-dark w-100"><i class="fa-solid fa-search me-1"></i> 검색</button>
                </div>
            </form>
        </div>

        <!-- Data Table -->
        <div class="card shadow-sm">
            <div class="card-header py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h6 class="m-0 font-weight-bold text-primary" id="listTitle">전체 데이터 목록 <span
                        class="badge bg-secondary ms-2" id="totalCount">0</span></h6>
                <div id="headerToggleButtons" class="d-flex flex-wrap gap-2 align-items-center">
                    <!-- Toggle buttons populated via JS -->
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="dataTable">
                        <thead>
                            <tr id="tableGroupHeaderRow">
                                <!-- Group Headers populated via JS -->
                            </tr>
                            <tr id="tableHeaderRow">
                                <!-- Headers populated via JS -->
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- 로딩 중 표시 -->
                            <tr>
                                <td colspan="90" class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                    데이터를 불러오는 중입니다...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
        </div>

    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tom Select JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <!-- 데이터 로드 -->
    <script src="data/hsmng_data_all.js"></script>
    <script src="data/hsmng_meta.js"></script>

    <script>
        const toggleGroups = {
            '년도별현황': 'grp-year',
            '개별허가': 'grp-permit',
            '인허가의제': 'grp-consult',
            '세부현황': 'grp-detail',
            '예산현황': 'grp-budget',
            '운영현황': 'grp-operate'
        };

        window.toggleColumnGroup = function (grpId, colCount, event) {
            if (event) event.stopPropagation();

            const table = document.getElementById('dataTable');
            const icon = document.getElementById(`icon-${grpId}`);
            const groupHeader = document.getElementById(`group-th-${grpId}`);
            const headerBtn = document.getElementById(`header-btn-${grpId}`);

            table.classList.toggle(`collapsed-${grpId}`);
            const isCollapsed = table.classList.contains(`collapsed-${grpId}`);

            if (icon) {
                if (isCollapsed) {
                    icon.classList.replace('fa-minus', 'fa-plus');
                } else {
                    icon.classList.replace('fa-plus', 'fa-minus');
                }
            }
            
            if (headerBtn) {
                if (isCollapsed) {
                    headerBtn.classList.remove('btn-primary', 'shadow-sm');
                    headerBtn.classList.add('btn-outline-secondary', 'text-muted');
                } else {
                    headerBtn.classList.remove('btn-outline-secondary', 'text-muted');
                    headerBtn.classList.add('btn-primary', 'shadow-sm');
                }
            }

            if (groupHeader) {
                if (isCollapsed) {
                    groupHeader.setAttribute('colspan', '1');
                } else {
                    groupHeader.setAttribute('colspan', colCount);
                }
            }
        };

        window.toggleAllGroups = function(isExpand) {
            const table = document.getElementById('dataTable');
            Object.keys(toggleGroups).forEach(category => {
                const grpId = toggleGroups[category];
                const colCount = hsDataMeta[category] ? hsDataMeta[category].length : 0;
                const isCollapsed = table.classList.contains(`collapsed-${grpId}`);
                
                if (isExpand && isCollapsed) {
                    window.toggleColumnGroup(grpId, colCount);
                } else if (!isExpand && !isCollapsed) {
                    window.toggleColumnGroup(grpId, colCount);
                }
            });
        };

        document.addEventListener('DOMContentLoaded', function () {
            // hsDataDemo is loaded from hs_demo_data.js

            // State
            let currentData = [...hsDataDemo];
            let sortCol = { cat: null, idx: null, asc: true };

            // DOM Elements
            const tableBody = document.getElementById('tableBody');
            const totalCount = document.getElementById('totalCount');
            const searchForm = document.getElementById('searchForm');
            let regionTomSelect;

            // --- 초성 추출 함수 ---
            const CHOSUNG_LIST = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
            function getChosung(str) {
                let result = '';
                for (let i = 0; i < str.length; i++) {
                    let code = str.charCodeAt(i) - 44032;
                    if (code > -1 && code < 11172) {
                        result += CHOSUNG_LIST[Math.floor(code / 588)];
                    } else {
                        result += str.charAt(i);
                    }
                }
                return result;
            }

            // Initialization
            init();

            function initHeaderToggles() {
                const headerToggleButtons = document.getElementById('headerToggleButtons');
                let buttonsHtml = '<span class="text-secondary small fw-bold me-2"><i class="fa-solid fa-table-columns me-1"></i>항목 표시:</span>';

                Object.keys(toggleGroups).forEach(category => {
                    const grpId = toggleGroups[category];
                    const colCount = hsDataMeta[category] ? hsDataMeta[category].length : 0;
                    buttonsHtml += `<button type="button" class="btn btn-sm btn-primary rounded-pill px-3 fw-bold shadow-sm" id="header-btn-${grpId}" onclick="window.toggleColumnGroup('${grpId}', ${colCount})">
                        ${category}
                    </button>`;
                });
                
                buttonsHtml += `
                    <div class="ms-md-2 d-inline-block border-start border-2 ps-2">
                        <button type="button" class="btn btn-sm btn-outline-dark fw-bold" onclick="window.toggleAllGroups(true)">전체 펴기</button>
                        <button type="button" class="btn btn-sm btn-outline-dark fw-bold" onclick="window.toggleAllGroups(false)">전체 접기</button>
                    </div>
                `;
                
                headerToggleButtons.innerHTML = buttonsHtml;
            }

            function init() {
                initHeaderToggles();
                
                // Track scrolling to update active index elements
                const tableResp = document.querySelector('.table-responsive');
                tableResp.addEventListener('scroll', updateActiveScrollIndex);
                
                let regionsSet = new Set();
                hsDataDemo.forEach(item => {
                    const region = item.groups['기본현황']?.[15];
                    if (region && region.trim() !== '') regionsSet.add(region.trim());
                });

                let regionsData = Array.from(regionsSet).map(r => {
                    return { value: r, text: r, chosung: getChosung(r) };
                });

                regionsData.sort((a, b) => a.text.localeCompare(b.text));

                // Initialize Tom Select
                regionTomSelect = new TomSelect('#searchRegion', {
                    options: regionsData,
                    plugins: ['remove_button'],
                    searchField: ['text', 'chosung'],
                    valueField: 'value',
                    labelField: 'text',
                    placeholder: '지역 선택 (초성 지원)',
                    closeAfterSelect: true,
                    onItemAdd: function () {
                        this.setTextboxValue('');
                        this.refreshOptions();
                    },
                    render: {
                        option: function (data, escape) {
                            return `<div>${escape(data.text)}</div>`;
                        },
                        item: function (data, escape) {
                            return `<div>${escape(data.text)}</div>`;
                        }
                    }
                });

                // Populate initial data table
                renderTable();

                // Form submit event
                searchForm.addEventListener('submit', function (e) {
                    e.submitter?.blur();
                    e.preventDefault();
                    filterData();
                });
            }

            function filterData() {
                const status = document.getElementById('searchStatus').value;
                const ministry = document.getElementById('searchMinistry').value;
                const keyword = document.getElementById('searchKeyword').value.toLowerCase();
                const selectedRegions = regionTomSelect.getValue(); // Array

                currentData = hsDataDemo.filter(item => {
                    let match = true;
                    if (status && item.status !== status) match = false;
                    if (ministry && item.ministry !== ministry) match = false;
                    if (keyword && !item.name.toLowerCase().includes(keyword) && !item.address.toLowerCase().includes(keyword)) match = false;

                    if (match && selectedRegions && selectedRegions.length > 0) {
                        const region = (item.groups['기본현황']?.[15] || '').trim();

                        let regionMatch = false;
                        for (let r of selectedRegions) {
                            if (region === r) {
                                regionMatch = true;
                                break;
                            }
                        }
                        if (!regionMatch) match = false;
                    }

                    return match;
                });

                renderTable();
            }
            
            window.sortData = function(category, idx, thEl) {
                if (sortCol.cat === category && sortCol.idx === idx) {
                    sortCol.asc = !sortCol.asc;
                } else {
                    sortCol.cat = category;
                    sortCol.idx = idx;
                    sortCol.asc = true;
                }
                
                currentData.sort((a, b) => {
                    let valA = (a.groups[category] && a.groups[category][idx]) ? a.groups[category][idx].toString() : '';
                    let valB = (b.groups[category] && b.groups[category][idx]) ? b.groups[category][idx].toString() : '';
                    
                    let numA = parseFloat(valA.replace(/,/g, ''));
                    let numB = parseFloat(valB.replace(/,/g, ''));
                    
                    let cmp = 0;
                    if (!isNaN(numA) && !isNaN(numB) && valA.trim() !== '' && valB.trim() !== '') {
                        cmp = numA - numB;
                    } else {
                        cmp = valA.localeCompare(valB);
                    }
                    return sortCol.asc ? cmp : -cmp;
                });
                
                document.querySelectorAll('.sort-icon').forEach(el => el.remove());
                thEl.innerHTML += `<span class="sort-icon fw-bold ms-1" style="color:#0d6efd;"><i class="fa-solid fa-sort-${sortCol.asc ? 'up' : 'down'}"></i></span>`;
                
                renderTableList();
            };

            function renderTable() {
                totalCount.textContent = currentData.length;

                // Setup header if not set
                const groupHeaderRow = document.getElementById('tableGroupHeaderRow');
                const headerRow = document.getElementById('tableHeaderRow');

                if (headerRow.innerHTML.trim() === '<!-- Headers populated via JS -->') {
                    let groupHtml = '<th class="text-center border-bottom-0" style="position: sticky; left: 0; background: #e9ecef; z-index: 14; border-right: 1px solid #dee2e6;"></th>';
                    let thHtml = '<th class="text-center" style="width: 50px; min-width: 50px; max-width: 50px; position: sticky; left: 0; background: #e9ecef; z-index: 13;">No</th>';

                    const groupOrder = ['기본현황', '기타', '년도별현황', '구축관리', '설계', '개별허가', '인허가의제', '시공', '기간', '세부현황', '예산현황', '운영현황'];

                    groupOrder.forEach(category => {
                        if (hsDataMeta[category]) {
                            const isToggle = toggleGroups[category];
                            const grpId = toggleGroups[category] || '';
                            const colCount = hsDataMeta[category].length;

                            // Group Header (Top Row)
                            if (isToggle) {
                                groupHtml += `<th colspan="${colCount}" class="text-center align-middle" style="background-color: #e6f2ff; border-left: 2px solid #ced4da !important; font-size: 0.95rem; z-index: 12;" id="group-th-${grpId}">
                                    <div class="d-flex align-items-center justify-content-center">
                                        <span class="fw-bold text-primary">${category}</span>
                                        <span class="badge bg-white text-primary border border-primary ms-1" style="font-size: 0.75rem;">${colCount}</span>
                                        <button class="btn btn-sm btn-outline-secondary py-0 px-1 ms-2" onclick="toggleColumnGroup('${grpId}', ${colCount}, event)" title="접기/펴기">
                                            <i class="fa-solid fa-minus" id="icon-${grpId}"></i>
                                        </button>
                                    </div>
                                </th>`;
                            } else {
                                groupHtml += `<th colspan="${colCount}" class="text-center align-middle bg-light" style="border-left: 2px solid #ced4da !important; font-size: 0.95rem; z-index: 12;">
                                    <span class="fw-bold">${category}</span>
                                </th>`;
                            }

                            // Field Header (Bottom Row)
                            hsDataMeta[category].forEach((fieldName, fIdx) => {
                                let thClass = '';
                                let addBorder = (fIdx === 0) ? ' border-left: 2px solid #ced4da !important;' : '';

                                if (isToggle) {
                                    if (fIdx === 0) {
                                        thClass = `group-first-${grpId}`;
                                    } else {
                                        thClass = `group-toggle-${grpId}`;
                                    }
                                }

                                if (fieldName === '관리번호') {
                                    thHtml += `<th class="${thClass}" style="width: 120px; min-width: 120px; max-width: 120px; position: sticky; left: 50px; background: #e9ecef; z-index: 13;${addBorder}" title="${category}" onclick="sortData('${category}', ${fIdx}, this)">${fieldName}</th>`;
                                } else if (fieldName === '관리카드 번호') {
                                    thHtml += `<th class="${thClass}" style="width: 140px; min-width: 140px; max-width: 140px; position: sticky; left: 170px; background: #e9ecef; z-index: 13;${addBorder}" title="${category}" onclick="sortData('${category}', ${fIdx}, this)">${fieldName}</th>`;
                                } else {
                                    let toggleBg = isToggle ? ' background-color: #f4f9ff;' : '';
                                    thHtml += `<th class="${thClass}" style="min-width: 100px;${toggleBg}${addBorder}" title="${category}" onclick="sortData('${category}', ${fIdx}, this)">${fieldName}</th>`;
                                }
                            });
                        }
                    });

                    groupHtml += '<th class="text-center bg-light" style="position: sticky; right: 0; z-index: 14; border-left: 2px solid #ced4da !important;"></th>';
                    thHtml += '<th class="text-center sticky-col bg-light" style="min-width: 80px; border-left: 2px solid #ced4da !important;">관리</th>';

                    groupHeaderRow.innerHTML = groupHtml;
                    headerRow.innerHTML = thHtml;
                }

                renderTableList();
                
                // Adjust header row 2 top offset immediately after render
                setTimeout(() => {
                    let groupRowHeight = document.getElementById('tableGroupHeaderRow').offsetHeight || 37;
                    document.querySelectorAll('#tableHeaderRow th').forEach(th => {
                        th.style.top = (groupRowHeight - 1) + 'px';
                    });
                }, 50);
            }

            function renderTableList() {
                // Render List
                tableBody.innerHTML = '';

                if (currentData.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="90" class="text-center py-5 text-muted">검색 결과가 없습니다.</td></tr>`;
                } else {
                    const groupOrder = ['기본현황', '기타', '년도별현황', '구축관리', '설계', '개별허가', '인허가의제', '시공', '기간', '세부현황', '예산현황', '운영현황'];

                    currentData.forEach((item, index) => {
                        const globalIndex = index + 1;

                        const tr = document.createElement('tr');
                        tr.onclick = function (e) {
                            if (!e.target.closest('button')) {
                                window.location.href = 'hs4_form.html?id=' + encodeURIComponent(item.id);
                            }
                        };

                        let tdHtml = `<td class="text-center text-muted fw-bold" style="width: 50px; min-width: 50px; max-width: 50px; position: sticky; left: 0; background: #fff; z-index: 10; border-right: 1px solid #dee2e6;">${globalIndex}</td>`;

                        groupOrder.forEach(category => {
                            if (item.groups[category]) {
                                item.groups[category].forEach((val, idx) => {
                                    let fieldName = hsDataMeta[category] ? hsDataMeta[category][idx] : '';
                                    let displayVal = val || '';

                                    // Make sure we don't convert numbers in '충전기수' or other number fields
                                    let isCheck = (displayVal === 'O' || displayVal === '●' || displayVal.toLowerCase() === 'true' || displayVal === '1');
                                    let cellClass = 'text-truncate';

                                    if (toggleGroups[category]) {
                                        if (idx === 0) {
                                            cellClass += ` group-first-${toggleGroups[category]}`;
                                        } else {
                                            cellClass += ` group-toggle-${toggleGroups[category]}`;
                                        }
                                    }

                                    let addBorder = (idx === 0) ? ' border-left: 2px solid #ced4da !important;' : '';

                                    if (fieldName === '충전기수' || fieldName.includes('용량') || fieldName.includes('임대료')) {
                                        isCheck = false;
                                    }

                                    if (isCheck) {
                                        displayVal = '<span class="badge bg-success"><i class="fa-solid fa-check"></i></span>';
                                    } else if (displayVal === '미정') {
                                        displayVal = '<span class="badge bg-primary">미정</span>';
                                    } else if (displayVal === '확인필요') {
                                        displayVal = '<span class="badge bg-danger">확인필요</span>';
                                    } else if (['미해당', '개별', '의제', '-'].includes(displayVal)) {
                                        displayVal = `<span class="badge badge-status-gray">${displayVal}</span>`;
                                    } else if (fieldName === '관리카드 번호') {
                                        if (displayVal.includes('完')) {
                                            displayVal = '<span class="badge bg-success">' + displayVal + '</span>';
                                        } else if (displayVal.includes('不')) {
                                            displayVal = '<span class="badge bg-danger">' + displayVal + '</span>';
                                        } else if (displayVal.trim() !== '') {
                                            displayVal = '<span class="badge bg-info text-dark">' + displayVal + '</span>';
                                        }
                                    } else if (fieldName === '구분' || fieldName === '상태') { // Assuming '상태' or '구분' is the status logic
                                        if (displayVal.includes('구축중')) {
                                            displayVal = '<span class="badge badge-status-gu">' + displayVal + '</span>';
                                        } else if (displayVal.includes('운영중')) {
                                            displayVal = '<span class="badge badge-status-un">' + displayVal + '</span>';
                                        } else if (displayVal.includes('반영')) { // 예산반영 등
                                            displayVal = '<span class="badge badge-status-ye">' + displayVal + '</span>';
                                        } else if (displayVal.includes('취소') || displayVal.includes('변경')) {
                                            displayVal = '<span class="badge badge-status-can">' + displayVal + '</span>';
                                        } else if (displayVal.trim() !== '') {
                                            displayVal = '<span class="badge badge-status-gray">' + displayVal + '</span>';
                                        }
                                    } else if (displayVal === '구축중') {
                                        displayVal = '<span class="badge badge-status-gu">구축중</span>';
                                    } else if (displayVal === '운영중') {
                                        displayVal = '<span class="badge badge-status-un">운영중</span>';
                                    }

                                    let cellStyle = 'max-width: 150px;' + addBorder;
                                    if (fieldName === '관리번호') {
                                        cellStyle = `width: 120px; min-width: 120px; max-width: 120px; position: sticky; left: 50px; background: #fff; z-index: 10;${addBorder}`;
                                        cellClass = cellClass.replace('text-truncate', '') + ' text-truncate';
                                    } else if (fieldName === '관리카드 번호') {
                                        cellStyle = `width: 140px; min-width: 140px; max-width: 140px; position: sticky; left: 170px; background: #fff; z-index: 10;${addBorder}`;
                                        cellClass = cellClass.replace('text-truncate', '') + ' text-truncate';
                                    }

                                    tdHtml += `<td class="${cellClass}" style="${cellStyle}" title="${val}">${displayVal}</td>`;
                                });
                            }
                        });

                        tdHtml += `
                            <td class="text-center sticky-col bg-light" style="border-left: 2px solid #ced4da !important;">
                                <div class="action-btns justify-content-center">
                                    <button class="btn btn-sm btn-outline-primary btn-sm-icon" onclick="event.stopPropagation(); window.location.href='hs4_form.html?id=${encodeURIComponent(item.id)}'" title="수정">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger btn-sm-icon" onclick="event.stopPropagation(); deleteItem('${item.id}')" title="삭제">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        `;
                        tr.innerHTML = tdHtml;
                        tableBody.appendChild(tr);
                    });
                }
                
                buildScrollIndex();
                buildScrollHIndex();
                updateActiveScrollIndex();
            }

            function updateActiveScrollIndex() {
                const tableResp = document.querySelector('.table-responsive');
                if(!tableResp) return;
                
                const scrollTop = tableResp.scrollTop;
                const scrollLeft = tableResp.scrollLeft;

                // 1) Update Vertical Index
                const vItems = document.querySelectorAll('.scroll-index-item');
                if (vItems.length > 0) {
                    let activeVIndex = 0;
                    vItems.forEach((el, idx) => {
                        const targetIdx = parseInt(el.getAttribute('data-target-idx'), 10);
                        const row = document.getElementById('tableBody').children[targetIdx];
                        if (row && (scrollTop + tableResp.clientHeight / 3) >= row.offsetTop - 150) {
                            activeVIndex = idx;
                        }
                    });

                    vItems.forEach(el => el.classList.remove('active'));
                    if (vItems[activeVIndex]) vItems[activeVIndex].classList.add('active');
                }

                // 2) Update Horizontal Index
                const hItems = document.querySelectorAll('.scroll-h-index-item');
                if (hItems.length > 0) {
                    let activeHIndex = 0;
                    const ths = document.querySelectorAll('#tableGroupHeaderRow th');
                    
                    hItems.forEach((el, idx) => {
                        const cat = el.textContent.trim();
                        const targetTh = Array.from(ths).find(th => th.textContent.includes(cat));
                        if(targetTh) {
                            const leftPos = targetTh.offsetLeft - 310; // offset for 3 fixed columns (50+120+140)
                            if ((scrollLeft + tableResp.clientWidth / 3) >= leftPos) {
                                activeHIndex = idx;
                            }
                        }
                    });

                    hItems.forEach(el => el.classList.remove('active'));
                    if(hItems[activeHIndex]) hItems[activeHIndex].classList.add('active');
                }
            }

            function buildScrollHIndex() {
                let existing = document.getElementById('scrollHIndex');
                if(existing) existing.remove();
                
                let div = document.createElement('div');
                div.id = 'scrollHIndex';
                div.className = 'scroll-h-index';
                
                let titleDiv = document.createElement('div');
                titleDiv.className = 'text-center text-primary border-end pe-2 me-2';
                titleDiv.style.fontSize = '0.65rem';
                titleDiv.style.pointerEvents = 'none';
                titleDiv.innerHTML = '<i class="fa-solid fa-arrows-left-right"></i>';
                div.appendChild(titleDiv);
                
                const groupOrder = ['기본현황', '기타', '년도별현황', '구축관리', '설계', '개별허가', '인허가의제', '시공', '기간', '세부현황', '예산현황', '운영현황'];
                
                groupOrder.forEach(cat => {
                    let el = document.createElement('div');
                    el.className = 'scroll-h-index-item';
                    el.textContent = cat;
                    el.onclick = () => {
                        let ths = document.querySelectorAll('#tableGroupHeaderRow th');
                        let targetTh = Array.from(ths).find(th => th.textContent.includes(cat));
                        if(targetTh) {
                            let tableResp = document.querySelector('.table-responsive');
                            let leftPos = targetTh.offsetLeft - 310; // offset for 3 fixed columns (50+120+140)
                            tableResp.scrollTo({ left: leftPos, behavior: 'smooth' });
                        }
                    };
                    div.appendChild(el);
                });
                
                document.body.appendChild(div);
            }

            function buildScrollIndex() {
                let existing = document.getElementById('scrollIndex');
                if(existing) existing.remove();
                
                if(currentData.length === 0) return;
                
                let div = document.createElement('div');
                div.id = 'scrollIndex';
                div.className = 'scroll-index';
                
                // interval: create shortcut every 20 items (or 50 if high volume)
                let interval = currentData.length > 200 ? 50 : 20;
                
                let titleDiv = document.createElement('div');
                titleDiv.className = 'text-center text-primary mb-1 pb-1 border-bottom';
                titleDiv.style.fontSize = '0.65rem';
                titleDiv.innerHTML = '<i class="fa-solid fa-list-ol"></i>';
                div.appendChild(titleDiv);
                
                for(let i=0; i<currentData.length; i+=interval) {
                    let num = i===0 ? 1 : i;
                    let el = document.createElement('div');
                    el.className = 'scroll-index-item';
                    el.textContent = num;
                    el.setAttribute('data-target-idx', i);
                    el.onclick = () => {
                        let row = tableBody.children[i];
                        if(row) {
                            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    };
                    div.appendChild(el);
                }
                
                // Add the last index
                let lastIndex = currentData.length;
                if(currentData.length % interval !== 0 && currentData.length > interval) {
                    let el = document.createElement('div');
                    el.className = 'scroll-index-item';
                    el.textContent = lastIndex;
                    el.setAttribute('data-target-idx', lastIndex - 1);
                    el.onclick = () => {
                        let row = tableBody.children[lastIndex - 1];
                        if(row) {
                            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    };
                    div.appendChild(el);
                }
                
                document.body.appendChild(div);
            }

            // Global Delete fn
            window.deleteItem = function (id) {
                if (confirm('이 항목을 삭제하시겠습니까? (데모이므로 실제 파일이 변경되지는 않습니다.)')) {
                    const index = hsDataDemo.findIndex(i => i.id === id);
                    if (index > -1) {
                        hsDataDemo.splice(index, 1);
                        filterData(); // re-render
                        alert('삭제되었습니다.');
                    }
                }
            }
        });
    </script>
</body>

</html>
