<!DOCTYPE html>
<html lang="ko">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>기술검토 현황 - 기술검토 인프라</title>
    <link type="text/css" rel="stylesheet" href="common.css">
    <link type="text/css" rel="stylesheet" href="common_styles.css">
    <link type="text/css" rel="stylesheet" href="hdCommon.css">
    <link type="text/css" rel="stylesheet" href="jquery-ui.css">
    <script type="text/javascript" src="jquery.min.js"></script>
    <script type="text/javascript" src="common.js"></script>
    <style>
        /* 헤더 가림 방지를 위한 본문 여백 추가 */
        .container {
            margin-top: 40px !important;
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-submit {
            background: #e3f2fd;
            color: #1976d2;
        }

        /* 제출완료 */
        .status-request {
            background: #fff3e0;
            color: #f57c00;
        }

        /* 검토요청 */
        .status-ing {
            background: #e8f5e9;
            color: #388e3c;
        }

        /* 검토중 */
        .status-done {
            background: #f5f5f5;
            color: #616161;
        }

        /* 검토완료 */
    </style>
</head>

<body>
    <div class="all-container">
        <!-- Header -->
        <div class="container-fluid top-frame">
            <div class="top-title off">
                <div class="top-left">
                    <img class="top-logo" src="hev_logo.png">
                </div>
                <div class="top-right">
                    <div class="user-wrap">
                        <div class="user-name"><img class="user-icon" src="icon_account.png"> 환경청/공단 담당자 님</div>
                        <button class="btn-black"><span>로그아웃</span></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="inner">
                <div class="con-right" style="width: 100%; padding: 0;">
                    <!-- 본문 제목 영역 -->
                    <div class="con m-b-20">
                        <div class="content-title">
                            <p class="txt-icon">
                                <span class="home">홈</span>
                                <span>기술검토</span>
                                <span class="on">기술검토 현황</span>
                            </p>
                            <div style="font-size: 24px; font-weight: bold; margin-top: 5px;">기술검토 요청 및 접수 현황</div>
                        </div>
                    </div>

                    <!-- 검색 영역 -->
                    <div class="con m-b-15">
                        <h2>검색 조건</h2>
                        <div class="page-block search-wrap">
                            <table class="table-left">
                                <tbody>
                                    <tr>
                                        <th>상태</th>
                                        <td>
                                            <select class="selc_style02" style="width: 150px;">
                                                <option value="">전체</option>
                                                <option>제출완료</option>
                                                <option>검토요청</option>
                                                <option>검토중</option>
                                                <option>검토완료</option>
                                            </select>
                                        </td>
                                        <th>시설명</th>
                                        <td><input type="text" class="selc_style02" style="width: 100%;"></td>
                                    </tr>
                                </tbody>
                            </table>
                            <div class="btn-wrap">
                                <button class="btn_square btn_navy_bg">조회</button>
                            </div>
                        </div>
                    </div>

                    <!-- 목록 영역 -->
                    <div class="con">
                        <div
                            style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px;">
                            <h2>검색 결과: <b>3</b>건</h2>
                        </div>
                        <table class="table-center">
                            <colgroup>
                                <col width="5%">
                                <col width="10%">
                                <col width="15%">
                                <col width="20%">
                                <col width="10%">
                                <col width="10%">
                                <col width="15%">
                                <col width="15%">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th>순번</th>
                                    <th>상태</th>
                                    <th>환경청</th>
                                    <th>시설명</th>
                                    <th>제출자</th>
                                    <th>제출일</th>
                                    <th>첨부파일</th>
                                    <th>액션</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>3</td>
                                    <td><span class="status-badge status-submit">제출완료</span></td>
                                    <td>한강청</td>
                                    <td>인천 오류동 충전소</td>
                                    <td>홍길동</td>
                                    <td>2026-03-16</td>
                                    <td><button class="btn_small02 btn_green_bg">다운로드</button></td>
                                    <td>
                                        <button class="btn_small02 btn_blue02_bg"
                                            onclick="alert('공단으로 기술검토를 요청하였습니다.')">검토요청</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td><span class="status-badge status-request">검토요청</span></td>
                                    <td>수도권청</td>
                                    <td>서울 마곡 삼거리소</td>
                                    <td>김철수</td>
                                    <td>2026-03-15</td>
                                    <td><button class="btn_small02 btn_green_bg">다운로드</button></td>
                                    <td>
                                        <button class="btn_small02 btn_navy_bg"
                                            onclick="alert('접수 처리되었습니다.')">접수</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>1</td>
                                    <td><span class="status-badge status-ing">검토중</span></td>
                                    <td>금강청</td>
                                    <td>세종 어진동 충전소</td>
                                    <td>이영희</td>
                                    <td>2026-03-14</td>
                                    <td><button class="btn_small02 btn_green_bg">다운로드</button></td>
                                    <td>
                                        <button class="btn_small02 btn_blue02_bg"
                                            onclick="location.href='tech_review.html'">검토작성</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- 하단 버튼 영역 추가 -->
                        <div class="btn-wrap t-a-right m-t-20">
                            <button class="btn_square btn_blue02_bg" style="width: 150px;" 
                                onclick="location.href='tech_submit.html'">기술검토 요청</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
