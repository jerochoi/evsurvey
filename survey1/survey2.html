<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주차장 충전기 설치 현황</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #layout {
            display: flex;
            height: 100%;
        }

        #sidebar {
            width: 350px;
            background: #fff;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
        }

        #sidebar-header {
            padding: 15px 20px;
            background: #2c3e50;
            color: #fff;
        }

        #sidebar-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        #sidebar-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        #filter-container {
            padding: 15px;
            border-bottom: 1px solid #eee;
            background: #f8f9fa;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .legend-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        #list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .list-item {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .list-item:hover {
            background: #f1f3f5;
        }

        .list-item.active {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }

        .item-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            color: #333;
        }

        .item-addr {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .item-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .item-details {
            font-size: 11px;
            color: #555;
            background: #f1f3f5;
            padding: 4px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }

        .tag-env {
            background: #27ae60;
        }

        /* ME */
        .tag-ev {
            background: #f39c12;
        }

        /* Other EV */
        .tag-pub {
            background: #3498db;
        }

        /* Public */
        .tag-pri {
            background: #95a5a6;
        }

        /* Private */

        #map {
            flex: 1;
            height: 100%;
            background: #f0f2f5;
        }

        /* Marker Styles */
        .marker-base {
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        /* Colors */
        .bg-env {
            background-color: #27ae60;
        }

        .bg-ev {
            background-color: #f39c12;
        }

        .bg-pub {
            background-color: #3498db;
        }

        .bg-pri {
            background-color: #95a5a6;
        }

        .popup-content {
            font-size: 13px;
            width: 220px;
        }

        .popup-header {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .popup-info {
            margin-bottom: 8px;
            color: #555;
        }

        .popup-ev-box {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #eee;
            font-size: 12px;
        }

        .ev-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .ev-label {
            font-weight: bold;
            color: #444;
        }
    </style>
</head>

<body>

    <div id="layout">
        <!-- Sidebar Left (Parking List & Legend) -->
        <div id="sidebar">
            <div id="sidebar-header">
                <div id="sidebar-title">인천 공공주차장 & 충전소</div>
                <div id="sidebar-subtitle">환경부(ME) 및 일반 충전소 현황</div>
                <div id="sidebar-subtitle">주차장 50m 이내, 명칭 유사도 0.5</div>
                <div id="sidebar-subtitle">주차장 200m 이내, 명칭 유사도 0.7</div>
            </div>

            <div id="filter-container">
                <div style="font-weight:bold; margin-bottom:8px; font-size:14px;">범례 (아이콘)</div>
                <div class="legend-item">
                    <div class="legend-icon bg-env"><i class="fas fa-bolt"></i></div>
                    <span>환경부(ME) 충전소 (우선)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon bg-ev"><i class="fas fa-charging-station"></i></div>
                    <span>일반 충전소 (기타 사업자)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon bg-pub">P</div>
                    <span>일반 공영주차장 (충전소 없음)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon bg-pri" style="background:#7f8c8d;">P</div>
                    <span>민영/기타 주차장 (충전소 없음)</span>
                </div>
                <div style="margin-top:10px; font-size:12px; color:#666;">
                    * 목록을 클릭하면 해당 위치로 이동합니다.
                </div>
            </div>

            <div id="list-container">
                <!-- List items will be injected here -->
                <div style="padding:20px; text-align:center; color:#999;">데이터 로딩 중...</div>
            </div>
        </div>

        <!-- Map Area -->
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Init Map
            var map = L.map('map').setView([37.4563, 126.7052], 12);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                maxZoom: 19
            }).addTo(map);

            let markers = {}; // Store markers by ID or index for interaction

            // Fetch Data
            fetch('parking_matched_v2.json')
                .then(res => res.json())
                .then(data => {
                    renderMap(data);
                    renderList(data);
                })
                .catch(err => console.error("Error loading data:", err));

            function renderMap(data) {
                const markersGroup = L.featureGroup();

                data.forEach((p, index) => {
                    // Determine Icon Style
                    let iconClass = 'bg-pri';
                    let iconHtml = 'P';
                    let zIndex = 100;

                    if (p.is_env) {
                        iconClass = 'bg-env';
                        iconHtml = '<i class="fas fa-bolt"></i>';
                        zIndex = 300; // Prioritize ME Stations
                    } else if (p.has_ev) {
                        iconClass = 'bg-ev';
                        iconHtml = '<i class="fas fa-charging-station"></i>';
                        zIndex = 200;
                    } else if (p.type === 'public') {
                        iconClass = 'bg-pub';
                        iconHtml = 'P';
                    }

                    const icon = L.divIcon({
                        className: `marker-base ${iconClass}`,
                        html: iconHtml,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    const marker = L.marker([p.lat, p.lng], {
                        icon: icon,
                        zIndexOffset: zIndex
                    });

                    // Build Popup
                    let popupHtml = `
                    <div class="popup-content">
                        <div class="popup-header">${p.nm}</div>
                        <div class="popup-info">${p.addr || "주소 정보 없음"}</div>
                        <div class="popup-info" style="font-size:11px; color:#888;">
                            유형: ${p.type === 'public' ? '공영' : '민영/기타'}
                        </div>
                `;

                    if (p.has_ev) {
                        popupHtml += `<div class="popup-ev-box">`;
                        if (p.ev_stations && p.ev_stations.length > 0) {
                            popupHtml += `<div style="margin-bottom:4px; font-weight:bold;">충전소(${p.ev_stations.length}개)</div>`;
                            p.ev_stations.forEach(s => {
                                popupHtml += `
                                <div class="ev-row" style="border-bottom:1px dashed #ddd; padding-bottom:2px; margin-bottom:2px;">
                                    <span style="color:${s.type === 'ENV' ? '#27ae60' : '#f39c12'}; font-weight:bold;">
                                        ${s.type === 'ENV' ? 'ME' : '일반'}
                                    </span>
                                    <span>${s.statId}</span>
                                </div>
                                <div style="font-size:10px; color:#666; margin-bottom:4px;">${s.statNm}</div>
                            `;
                            });
                        } else {
                            popupHtml += `<div>충전소 정보 있음</div>`;
                        }
                        popupHtml += `</div>`;
                    }

                    popupHtml += `</div>`;
                    marker.bindPopup(popupHtml);

                    marker.on('click', () => {
                        highlightListItem(index);
                    });

                    marker.addTo(map);
                    markers[index] = marker;
                    markersGroup.addLayer(marker);
                });

                if (data.length > 0) {
                    map.fitBounds(markersGroup.getBounds());
                }
            }

            function renderList(data) {
                const container = document.getElementById('list-container');
                container.innerHTML = '';

                // Sort: EV stations first, then Public
                const sortedData = data.map((item, idx) => ({ ...item, originalIndex: idx }))
                    .sort((a, b) => {
                        if (a.is_env !== b.is_env) return b.is_env - a.is_env;
                        if (a.has_ev !== b.has_ev) return b.has_ev - a.has_ev;
                        return 0; // Keep original order otherwise
                    });

                sortedData.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.dataset.index = p.originalIndex;

                    let tagsHtml = '';
                    let detailsHtml = '';

                    if (p.type === 'public') tagsHtml += `<span class="tag tag-pub">공영</span>`;
                    else tagsHtml += `<span class="tag tag-pri">민영</span>`;

                    if (p.is_env) {
                        tagsHtml += `<span class="tag tag-env">환경부 ME</span>`;
                        const count = p.ev_stations ? p.ev_stations.length : 0;
                        const ids = p.ev_stations ? p.ev_stations.map(s => s.statId).join(', ') : '';
                        detailsHtml = `<div class="item-details">⚡ 충전기 ${count}대 (ID: ${ids})</div>`;
                    } else if (p.has_ev) {
                        tagsHtml += `<span class="tag tag-ev">충전소</span>`;
                        const count = p.ev_stations ? p.ev_stations.length : 0;
                        const ids = p.ev_stations ? p.ev_stations.map(s => s.statId).join(', ') : '';
                        detailsHtml = `<div class="item-details">⚡ 충전기 ${count}대 (ID: ${ids})</div>`;
                    }

                    div.innerHTML = `
                    <div class="item-name">${p.nm}</div>
                    <div class="item-addr">${p.addr || ""}</div>
                    <div class="item-tags">${tagsHtml}</div>
                    ${detailsHtml}
                `;

                    div.addEventListener('click', () => {
                        const marker = markers[p.originalIndex];
                        if (marker) {
                            map.flyTo(marker.getLatLng(), 15);
                            marker.openPopup();
                            highlightListItem(p.originalIndex);
                        }
                    });

                    container.appendChild(div);
                });
            }

            function highlightListItem(index) {
                const item = document.querySelector(`.list-item[data-index="${index}"]`);
                if (item) {
                    document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }
        });
    </script>

</body>

</html>
