<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천 아파트 전기차 충전소 현황</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #layout {
            display: flex;
            height: 100%;
        }

        #sidebar {
            width: 380px;
            background: #fff;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
        }

        #sidebar-header {
            padding: 15px 20px;
            background: #2c3e50;
            color: #fff;
        }

        #sidebar-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        #sidebar-subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        #list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .list-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .list-item:hover {
            background: #f1f3f5;
        }

        .list-item.active {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }

        .apt-name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 6px;
            color: #333;
        }

        .apt-addr {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
            margin-bottom: 8px;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 4px;
        }

        .info-label {
            color: #888;
            margin-bottom: 2px;
        }

        .info-value {
            font-weight: bold;
            color: #444;
        }

        .stat-match-box {
            background: #e8f5e9;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #c8e6c9;
        }

        .stat-title {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-item {
            padding-left: 10px;
            border-left: 2px solid #a5d6a7;
            margin-top: 4px;
            color: #333;
        }

        #map {
            flex: 1;
            height: 100%;
            background: #f0f2f5;
        }

        .marker-apt {
            background-color: #3f51b5;
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .marker-apt-ev {
            background-color: #009688;
        }

        /* With Matched EV */

        .popup-content {
            font-size: 13px;
            width: 240px;
        }

        .popup-header {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
    </style>
</head>

<body>

    <div id="layout">
        <div id="sidebar">
            <div id="sidebar-header">
                <div id="sidebar-title">인천 아파트 전기차 충전</div>
                <div id="sidebar-subtitle">K-APT 데이터 & 충전소 매칭 + 보급률</div>
                <div id="sidebar-subtitle">위치 200m 이내, 명칭 유사도 0.7</div>
            </div>

            <div id="list-container">
                <div style="padding:20px; text-align:center; color:#999;">데이터 로딩 중...</div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var map = L.map('map').setView([37.565, 126.675], 13); // Default Incheon Seo-gu

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                maxZoom: 19
            }).addTo(map);

            let markers = {};

            fetch('kapt_matched.json')
                .then(res => res.json())
                .then(data => {
                    renderMap(data);
                    renderList(data);
                })
                .catch(err => console.error("Error loading data:", err));

            function formatDate(dateStr) {
                if (!dateStr || dateStr.length !== 8) return dateStr;
                return `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
            }

            function renderMap(data) {
                const markersGroup = L.featureGroup();

                data.forEach((apt, index) => {
                    const lat = parseFloat(apt.lat);
                    const lng = parseFloat(apt.lng);

                    if (isNaN(lat) || isNaN(lng)) return;

                    const hasMatch = apt.matched_stations && apt.matched_stations.length > 0;

                    const icon = L.divIcon({
                        className: `marker-apt ${hasMatch ? 'marker-apt-ev' : ''}`,
                        html: '<i class="fas fa-building"></i>',
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    // Calculate Rates
                    const totalParking = parseInt(apt.totalParking) || 0;
                    const kaptEvCount = parseInt(apt.totalEvParking) || 0;

                    let matchedEvCount = 0;
                    if (apt.matched_stations) {
                        apt.matched_stations.forEach(s => matchedEvCount += (s.chargerCount || 0));
                    }

                    const kaptRate = totalParking > 0 ? (kaptEvCount / totalParking * 100).toFixed(1) : '0';
                    const matchRate = totalParking > 0 ? (matchedEvCount / totalParking * 100).toFixed(1) : '0';

                    const marker = L.marker([lat, lng], { icon: icon });

                    let popupHtml = `
                    <div class="popup-content">
                        <div class="popup-header">${apt.kaptName}</div>
                        <div>${apt.addrRoad || apt.addrLegacy}</div>
                        <div style="font-size:11px; color:#666; margin-top:4px;">승인일: ${formatDate(apt.approvalDate)}</div>
                        
                        <div style="margin-top:8px; font-weight:bold;">주차 현황 (보급률)</div>
                        <div>총 주차: ${apt.totalParking}면</div>
                        <div>K-APT: ${apt.totalEvParking}면 (${kaptRate}%)</div>
                `;

                    if (hasMatch) {
                        popupHtml += `<div style="margin-top:8px; font-weight:bold; color:#009688;">매칭된 충전소 (${matchRate}%)</div>`;
                        apt.matched_stations.forEach(s => {
                            const count = s.chargerCount || '?';
                            popupHtml += `<div>ID: ${s.statId} (${count}기) - ${s.statNm}</div>`;
                        });
                    }

                    popupHtml += `</div>`;
                    marker.bindPopup(popupHtml);

                    marker.on('click', () => {
                        highlightListItem(index);
                    });

                    marker.addTo(map);
                    markers[index] = marker;
                    markersGroup.addLayer(marker);
                });

                if (markersGroup.getLayers().length > 0) {
                    map.fitBounds(markersGroup.getBounds());
                }
            }

            function renderList(data) {
                const container = document.getElementById('list-container');
                container.innerHTML = '';

                // Sort by Matched EV stations (desc), then total EV parking
                const sortedData = data.map((item, idx) => ({ ...item, originalIndex: idx }))
                    .sort((a, b) => {
                        const matchA = a.matched_stations ? a.matched_stations.length : 0;
                        const matchB = b.matched_stations ? b.matched_stations.length : 0;
                        if (matchA !== matchB) return matchB - matchA;

                        const evA = parseInt(a.totalEvParking) || 0;
                        const evB = parseInt(b.totalEvParking) || 0;
                        return evB - evA;
                    });

                sortedData.forEach(apt => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.dataset.index = apt.originalIndex;

                    // Calculate Rates
                    const totalParking = parseInt(apt.totalParking) || 0;
                    const kaptEvCount = parseInt(apt.totalEvParking) || 0;
                    let matchedEvCount = 0;
                    if (apt.matched_stations) {
                        apt.matched_stations.forEach(s => matchedEvCount += (s.chargerCount || 0));
                    }

                    const kaptRate = totalParking > 0 ? (kaptEvCount / totalParking * 100).toFixed(1) : '0';
                    const matchRate = totalParking > 0 ? (matchedEvCount / totalParking * 100).toFixed(1) : '0';

                    let matchInfo = '';
                    if (apt.matched_stations && apt.matched_stations.length > 0) {
                        let stationsHtml = '';
                        apt.matched_stations.forEach(s => {
                            const count = s.chargerCount || 0;
                            stationsHtml += `<div class="stat-item"><b>${s.statId}</b> (${count}기)<br><span style="font-size:11px; color:#555;">${s.statNm}</span></div>`;
                        });

                        matchInfo = `
                        <div class="stat-match-box">
                            <div class="stat-title">
                                <span><i class="fas fa-bolt"></i> 매칭 데이터 (${matchedEvCount}기)</span>
                                <span style="font-size:11px; color:#2e7d32; background:#fff; padding:1px 5px; border-radius:3px; border:1px solid #c8e6c9;">${matchRate}%</span>
                            </div>
                            ${stationsHtml}
                        </div>
                    `;
                    } else {
                        matchInfo = `<div style="font-size:11px; color:#aaa; margin-top:4px;">매칭된 공공 데이터 없음 (0%)</div>`;
                    }

                    div.innerHTML = `
                    <div class="apt-name">${apt.kaptName}</div>
                    <div class="apt-addr">${apt.addrRoad || apt.addrLegacy}</div>
                    <div style="font-size:11px; color:#888; margin-bottom:6px;">사용승인일: ${formatDate(apt.approvalDate)}</div>
                    
                    <div class="info-grid">
                        <div>
                            <div class="info-label">총 주차면수</div>
                            <div class="info-value">${apt.totalParking}</div>
                        </div>
                        <div>
                            <div class="info-label">K-APT 데이터</div>
                            <div class="info-value" style="color:#009688;">${apt.totalEvParking} <span style="font-size:11px; color:#555; font-weight:normal;">(${kaptRate}%)</span></div>
                        </div>
                    </div>
                    
                    ${matchInfo}
                `;

                    div.addEventListener('click', () => {
                        const marker = markers[apt.originalIndex];

                        if (marker) {
                            map.flyTo(marker.getLatLng(), 15);
                            marker.openPopup();
                            highlightListItem(apt.originalIndex);
                        } else {
                            alert("이 아파트에 대한 유효한 좌표 정보가 없습니다.");
                        }
                    });

                    container.appendChild(div);
                });
            }

            function highlightListItem(index) {
                const item = document.querySelector(`.list-item[data-index="${index}"]`);
                if (item) {
                    document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }
        });
    </script>

</body>

</html>
